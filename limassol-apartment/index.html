<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seaview Residence 12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one mobile column; key facts up top, sticky section nav, sections below. RTL-safe (logical properties). */
:root{
  --bg:#F3F6F6; --surface:#FFFFFF; --fg:#13282B; --muted:#5A6E71; --line:#D9E2E2;
  --accent:#0E6670; --accent-ink:#FFFFFF; --sun:#E8B23A; --chip:#E4EEEE;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D1A1C; --surface:#152A2D; --fg:#E6EFEF; --muted:#94AAAD; --line:#25403F;
  --accent:#4FC0C9; --accent-ink:#06282B; --sun:#F0C25A; --chip:#1C3638; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:2rem;line-height:1.1;font-weight:700}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1rem;font-weight:500}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.langs{display:flex;gap:4px;flex-wrap:wrap}
.langs button{font:600 .8rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:6px 8px;cursor:pointer;min-width:2.4em}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hello{margin-block:14px 18px;display:grid;gap:6px}
.hello p{margin:0;color:var(--muted);max-width:60ch}
.demo{font-size:.72rem;background:var(--sun);color:#3A2A00;border-radius:4px;padding:2px 7px;font-weight:600;width:max-content}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:2px;min-width:0;align-content:start}
.fact .k{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fact .v{font:700 1.05rem var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
nav.sec{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:18px;padding-block:8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.sec a{flex:none;font-size:.85rem;font-weight:500;color:var(--fg);text-decoration:none;background:var(--chip);border-radius:999px;padding:6px 12px}
section{margin-top:26px;display:grid;gap:10px;scroll-margin-top:56px}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card p{margin:0}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px}
summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-weight:500}
details[open] summary::after{content:"–"}
details .b{padding:0 14px 14px}
details .b p{margin:0 0 6px}
details .b a,.card a{color:var(--accent);font-weight:600;text-decoration:none}
.rules li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rules li:last-child{border-bottom:0}
.rules .n{font:700 .85rem var(--display);color:var(--accent);min-width:1.4em}
.sos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sos div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid}
.sos b{font:700 1.2rem var(--display);font-variant-numeric:tabular-nums}
.sos span{font-size:.82rem;color:var(--muted)}
.host{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:16px;display:grid;gap:6px}
.host .num{font:700 1.3rem var(--display);user-select:all;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;width:max-content}
.host p{margin:0;opacity:.92}
footer{margin-top:28px;font-size:.75rem;color:var(--muted);text-align:center}
.ltr{direction:ltr;unicode-bidi:isolate}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
@media (max-width:420px){.sos{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">

    <span class="eyebrow" id="area"></span>

  <section id="rules"><h2 data-t="rules"></h2><ul class="list rules" id="rulesList"></ul></section>

  <section id="help"><h2 data-t="help"></h2><div class="sos" id="sos"></div>
    <div class="host"><span class="eyebrow" style="color:inherit;opacity:.8" data-t="agent"></span><span class="num" id="hostNum"></span><p id="hostNote"></p></div>
  </section>
  <footer id="foot"></footer>
</div>

  en:{first:"First days",bills:"Bills & utilities",rules:"Building rules",life:"Living in Cyprus",help:"Help",agent:"Your property manager",rent:"Rent due",fees:"Communal fees",parking:"Parking",bins:"Rubbish days",more:"Website",demo:"Example apartment",foot:"Resident guide"},

};
const LANGS = {en:"EN",ru:"RU",he:"עב",uk:"UA",zh:"中文",fr:"FR",el:"ΕΛ"};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lang = "en";
try { const s = localStorage.getItem("guide-lang"); if (s && UI[s]) lang = s; else {
  const b = (navigator.language||"en").slice(0,2).replace("iw","he"); if (UI[b]) lang = b; } } catch(e) {}

function render(){
  const u = UI[lang], L = o => o[lang] || o.en;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
  $("langs").innerHTML = Object.entries(LANGS).map(([k,v])=>`<button type="button" data-l="${k}" lang="${k}" aria-pressed="${k===lang}">${v}</button>`).join("");
  $("area").textContent = L(DATA.area);
  $("name").textContent = DATA.name;
  $("welcome").textContent = L(DATA.welcome);
  $("demo").textContent = u.demo;
  $("facts").innerHTML = DATA.facts.map(f=>`<div class="fact"><span class="k">${u[f.k]}</span><span class="v">${esc(L(f.v))}</span></div>`).join("");
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent = u[el.dataset.t]);
  $("nav").innerHTML = ["first","bills","rules","life","help"].map(s=>`<a href="#${s}">${u[s]}</a>`).join("");
  $("firstList").innerHTML = DATA.first.map(a=>`<li class="card"><p>${esc(L(a))}</p></li>`).join("");
  const acc = x => `<details><summary>${esc(L(x.t))}</summary><div class="b"><p>${esc(L(x.b))}</p>${x.link?`<a class="ltr" href="${x.link}" target="_blank" rel="noopener">${u.more}: ${x.link.replace("https://www.","")}</a>`:""}</div></details>`;
  $("billsList").innerHTML = DATA.bills.map(acc).join("");
  $("lifeList").innerHTML = DATA.life.map(acc).join("");
  $("rulesList").innerHTML = DATA.rules.map((r,i)=>`<li><span class="n">${i+1}</span><span>${esc(L(r))}</span></li>`).join("");
  $("sos").innerHTML = DATA.sos.map(s=>`<div><b class="ltr">${esc(s.n)}</b><span>${esc(L(s.t))}</span></div>`).join("");
  $("hostNum").textContent = DATA.agent.phone;
  $("hostNote").textContent = L(DATA.agent.note);
  $("foot").textContent = `${DATA.name} · ${u.foot}`;
}
$("langs").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return;
  lang=b.dataset.l; try{localStorage.setItem("guide-lang",lang)}catch(_){} render(); });
render();
</script>
